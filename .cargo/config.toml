# Build for the host CPU so the scalar dequant/matvec loops autovectorize to AVX2/AVX-512
# (the CPU backend leans on this; the binary is then specific to this machine's ISA).
[build]
rustflags = ["-C", "target-cpu=native"]

# Local dev (CN network): crates.io downloads stall on this host; use rsproxy sparse mirror.
# Local-only change on our fork, not intended for upstream PR.
[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
retry = 5

[http]
timeout = 120

